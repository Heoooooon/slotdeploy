name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck bin/* install.sh test/*.sh demo/sandbox.sh
      - name: tests (real bare git remote, fake builds)
        run: |
          # Force every nested bash invocation to the OS Bash, including 3.2 on macOS.
          compat=$(mktemp -d)
          trap 'rm -rf "$compat"' EXIT
          ln -s /bin/bash "$compat/bash"
          /bin/bash --version
          PATH="$compat:$PATH" /bin/bash test/run.sh
